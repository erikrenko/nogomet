  <style>
    /* ── INDEX-SPECIFIC LAYOUT ── */
    .index-grid-top {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      align-items: start;
    }

    /* Short/full label toggle — desktop shows full, mobile shows short */
    .ix-lbl-short { display: none; }

    @media (max-width: 768px) {
      .index-grid-top { grid-template-columns: 1fr; }

      /* Switch to FIFA codes on mobile */
      .ix-lbl-full  { display: none; }
      .ix-lbl-short { display: inline; }

      /* Hide deadline warning in vs-block on mobile — too cramped */
      .deadline-warn { display: none; }

      /* Short result labels on mobile */
      .pred-chip .ix-lbl-full  { display: none; }
      .pred-chip .ix-lbl-short { display: inline; }
    }

    /* ── MATCH ROWS ── */
    .match-time-label {
      font-size: .65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--muted);
      padding: 6px 16px 4px;
      background: var(--bg-deep);
      border-bottom: 1px solid var(--border);
    }
    .no-matches {
      padding: 28px 16px;
      text-align: center;
      color: var(--muted);
      font-size: .85rem;
    }

    /* ── ONBOARDING MODAL ── */
    .ob-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.55);
      z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .ob-modal {
      background: var(--bg-mid); border-radius: var(--radius-xl);
      padding: 28px; max-width: 520px; width: 100%;
      max-height: 90vh; overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,.3);
    }
    .ob-progress {
      display: flex; gap: 6px; margin-bottom: 24px;
    }
    .ob-progress-bar {
      flex: 1; height: 4px; border-radius: 99px;
      background: var(--border); transition: background .3s;
    }
    .ob-progress-bar.done { background: var(--accent); }
    .ob-eyebrow {
      font-size: .65rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .1em; color: var(--muted); margin-bottom: 8px;
    }
    .ob-title {
      font-size: 1.35rem; font-weight: 900; color: var(--text);
      line-height: 1.15; margin-bottom: 10px; letter-spacing: -.02em;
    }
    .ob-subtitle {
      font-size: .85rem; color: var(--text-mid); line-height: 1.6; margin-bottom: 18px;
    }
    .ob-row {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 14px; border-radius: var(--radius-md);
      margin-bottom: 8px; border: 1.5px solid transparent;
    }
    .ob-row.green  { background: var(--green-bg);  border-color: var(--green);  }
    .ob-row.yellow { background: var(--gold-bg);   border-color: var(--gold);   }
    .ob-row.grey   { background: var(--bg-deep);   border-color: var(--border); }
    .ob-row-pts {
      font-size: 1.8rem; font-weight: 900; color: var(--accent);
      min-width: 36px; text-align: center; flex-shrink: 0;
    }
    .ob-row-pts-right {
      font-size: 1.4rem; font-weight: 900; color: var(--accent); margin-left: auto; flex-shrink: 0;
    }
    .ob-row-body { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
    .ob-row-body strong { font-size: .9rem; font-weight: 700; color: var(--text); }
    .ob-row-body span   { font-size: .78rem; color: var(--text-mid); }
    .ob-multiplier {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 14px; border-radius: var(--radius-md);
      background: var(--gold-bg); border: 1.5px solid var(--gold);
      font-size: .82rem; color: var(--text-mid); line-height: 1.4; margin-top: 4px;
    }
    .ob-multiplier-badge {
      background: var(--gold); color: #fff; border-radius: 8px;
      padding: 4px 10px; font-size: 1rem; font-weight: 900; flex-shrink: 0;
    }
    .ob-note {
      font-size: .75rem; color: var(--muted); text-align: center;
      padding: 8px; background: var(--bg-deep); border-radius: var(--radius-sm);
      margin-top: 8px;
    }
    .ob-footer {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 24px; padding-top: 16px;
      border-top: 1px solid var(--border);
    }
    .ob-btn-back {
      font-size: .85rem; font-weight: 600; color: var(--muted);
      background: none; border: none; cursor: pointer;
      display: flex; align-items: center; gap: 4px; padding: 4px 0;
    }
    .ob-btn-skip {
      font-size: .85rem; font-weight: 600; color: var(--muted);
      background: none; border: none; cursor: pointer; padding: 4px 8px;
      margin-left: auto; margin-right: 12px;
    }
    .ob-btn-next {
      background: var(--accent); color: #fff; border: none;
      border-radius: 99px; padding: 10px 22px;
      font-size: .9rem; font-weight: 700; cursor: pointer;
      font-family: var(--font-main);
      display: flex; align-items: center; gap: 6px;
      transition: background .15s;
    }
    .ob-btn-next:hover { background: var(--accent-dark); }
    /* Step 4 colleague grid */
    .ob-colleague-grid {
      display: grid; grid-template-columns: repeat(5, 1fr);
      gap: 8px; margin-bottom: 16px; max-height: 260px; overflow-y: auto;
    }
    .ob-colleague-chip {
      padding: 9px 6px; border-radius: 10px;
      border: 1.5px solid var(--border); background: #fff;
      font-size: .75rem; font-weight: 600; text-align: center;
      cursor: pointer; transition: all .15s; color: var(--text);
    }
    .ob-colleague-chip:hover { border-color: var(--accent); background: #f0faf0; }
    .ob-colleague-chip.selected { border-color: var(--accent); background: #f0faf0; color: var(--accent-dark); font-weight: 700; }
  </style>
</head>

  <script>
    // Hamburger toggle — pure DOM, no app logic
    (function(){
      var btn   = document.getElementById('nav-menu-btn');
      var links = document.getElementById('navbar-links');
      if (!btn || !links) return;
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        var open = links.classList.toggle('open');
        btn.setAttribute('aria-expanded', open);
        btn.textContent = open ? '✕' : '☰';
      });
      document.addEventListener('click', function(e){
        if (!links.contains(e.target) && e.target !== btn) {
          links.classList.remove('open');
          btn.setAttribute('aria-expanded', false);
          btn.textContent = '☰';
        }
      });
      // Close on nav link tap
      links.querySelectorAll('.navbar-link').forEach(function(a){
        a.addEventListener('click', function(){
          links.classList.remove('open');
          btn.textContent = '☰';
        });
      });
    })();

  <script>
  (async () => {

    /* ── AUTH CHECK ─────────────────────────────────────── */
    if (!NP.requireAuth()) return;
    // Always refresh profile from DB so alias/display_name changes are picked up immediately
    const profile = await NP.refreshUserProfile() ?? NP.getUserProfile();
    const state   = await NP.getTournamentNow();

    /* ── ONBOARDING ─────────────────────────────────────── */

    window._npState = state;

    /* ── NAVBAR ─────────────────────────────────────────── */

      NP.getAlias(profile, state, 'full');
    var sl = document.getElementById('navbar-selektor-link'); if (NP.isAdmin() && sl) sl.style.display = 'flex';
    document.getElementById('nav-avatar').textContent = profile.display_name.charAt(0).toUpperCase();


    /* ── PLUGINS ────────────────────────────────────────── */
    await NP.applyPlugins();

    /* ── TODAY'S MATCHES ────────────────────────────────── */
    await _loadNextMatches(profile, state);

    /* ── MINI LEADERBOARD ───────────────────────────────── */
    await _loadLeaderboard(profile, state);

    /* ── ANNOUNCEMENT SLOT SPACING ── */
    // When bar is injected, reduce page-wrap top padding so there's no double gap
    const _annSlot = document.getElementById('announcement-slot');
    const _pageWrap = document.getElementById('page-wrap');
    if (_annSlot && _pageWrap) {
      const observer = new MutationObserver(() => {
        if (_annSlot.children.length > 0) {
          _pageWrap.style.paddingTop = '12px';
        } else {
          _pageWrap.style.paddingTop = '';
        }
      });
      observer.observe(_annSlot, { childList: true });
    }

  })();

  /* ══════════════════════════════════════════════════════
     TODAY'S MATCHES
     ══════════════════════════════════════════════════════ */
  async function _loadNextMatches(profile, state) {
    const list = document.getElementById('matches-list');
    const now  = new Date();
    const months = ['jan','feb','mar','apr','maj','jun','jul','avg','sep','okt','nov','dec'];
    const mult = state?.multiplier ?? 1;

    const TOTAL = 10;
    const MAX_PAST = 3;
    const from = new Date(now - 2 * 60 * 60 * 1000);

    // Fetch future up to TOTAL, then trim after we know past count
    const { data: futureMatches } = await NP.db
      .from('matches')
      .select(`id, kickoff_at, home_score_90, away_score_90, home_score_120, away_score_120, group_name, phase,
        home_team:teams!matches_home_team_id_fkey(id, name_sl, flag_code, fifa_code),
        away_team:teams!matches_away_team_id_fkey(id, name_sl, flag_code, fifa_code)`)
      .is('home_score_90', null)
      .gte('kickoff_at', from.toISOString())
      .order('kickoff_at')
      .limit(TOTAL);

    const futureAll = futureMatches ?? [];
    const pastLimit = futureAll.length === 0 ? TOTAL : Math.min(MAX_PAST, TOTAL - Math.min(futureAll.length, TOTAL - MAX_PAST));

    const { data: pastMatches } = await NP.db
      .from('matches')
      .select(`id, kickoff_at, home_score_90, away_score_90, home_score_120, away_score_120, group_name, phase,
        home_team:teams!matches_home_team_id_fkey(id, name_sl, flag_code, fifa_code),
        away_team:teams!matches_away_team_id_fkey(id, name_sl, flag_code, fifa_code)`)
      .not('home_score_90', 'is', null)
      .not('result_published_at', 'is', null)
      .order('kickoff_at', { ascending: false })
      .limit(pastLimit);

    const past   = (pastMatches ?? []).reverse(); // chronological order
    const future = futureAll.slice(0, TOTAL - past.length);
    const allIds = [...past, ...future].map(m => m.id);

    if (!allIds.length) {
      list.innerHTML = '<div class="no-matches">Ni tekem. 🏁</div>';
      return;
    }

    // Fetch predictions for all these matches
    const { data: preds } = await NP.db
      .from('predictions')
      .select('match_id, pred_home, pred_away, points_awarded')
      .eq('user_id', profile.id)
      .in('match_id', allIds);

    const predMap = {};
    (preds ?? []).forEach(p => { predMap[p.match_id] = p; });

    const dateLabel = (kickoff) => {
      const d = new Date(kickoff);
      const full  = `${d.getDate()}. ${months[d.getMonth()]}`;
      const short = `${d.getDate()}.${d.getMonth() + 1}.`;
      return `<span class="ix-lbl-full">${full}</span><span class="ix-lbl-short">${short}</span>`;
    };

    const _renderRow = (m, isPast) => {
      const pred   = predMap[m.id] ?? null;
      const locked = NP.isPredictionLocked(m.kickoff_at);
      const isLive = !isPast && new Date(m.kickoff_at) < now;

      // Col 3: score or time
      let centerHtml;
      if (isPast) {
        const hs = m.home_score_120 ?? m.home_score_90;
        const as = m.away_score_120 ?? m.away_score_90;
        centerHtml = `<div class="vs-score">${hs} – ${as}</div>`;
      } else if (isLive) {
        centerHtml = `<div class="vs-time vs-live" style="color:var(--red);font-weight:700">🔴 V teku</div>`;
      } else {
        const deadline = new Date(m.kickoff_at) - 3600000;
        const mins = Math.floor((deadline - Date.now()) / 60000);
        const warn = !locked && mins <= 180
          ? `<div class="deadline-warn" style="font-size:.62rem;margin-top:1px">⚠️ ${NP.formatCountdown(deadline)}</div>` : '';
        centerHtml = `<div class="vs-time" style="line-height:1.2">${NP.formatKickoff(m.kickoff_at, false)}${warn}</div>`;
      }

      // Col 5: my prediction (grey pill) — shown whenever pred exists
      let predPreviewHtml = '';
      if (pred) {
        predPreviewHtml = `<span class="pred-chip pending" style="font-size:.68rem">${pred.pred_home}–${pred.pred_away}</span>`;
      }

      // Col 6: outcome chip (past) OR button (open future) OR missing (locked no pred)
      let rightHtml = '';
      if (isPast) {
        if (!pred) {
          rightHtml = `<span class="pred-chip missing">✗ Manjka</span>`;
        } else {
          const ph = pred.pred_home, pa = pred.pred_away;
          const hs = m.home_score_120 ?? m.home_score_90;
          const as = m.away_score_120 ?? m.away_score_90;
          const exact = ph === hs && pa === as;
          const correctWinner = !exact && ((ph>pa&&hs>as)||(ph<pa&&hs<as)||(ph===pa&&hs===as));
          const mult = state?.multiplier ?? 1;
          const pts = exact ? 3*mult : correctWinner ? 1*mult : 0;
          if (exact)              rightHtml = `<span class="pred-chip exact">✓ Natančno · +${pts}</span>`;
          else if (correctWinner) rightHtml = `<span class="pred-chip correct">✓ Pravilno · +${pts}</span>`;
          else                    rightHtml = `<span class="pred-chip wrong">✗ Napačno</span>`;
        }
      } else if (locked) {
        if (!pred) rightHtml = `<span class="pred-chip missing">✗ Manjka</span>`;
        // locked with pred: predPreview already shows it, col 6 empty
      } else {
        rightHtml = `<a href="predictions.html#match-${m.id}" class="${pred ? 'match-btn-text' : 'btn btn-primary btn-sm match-action-btn'}">${pred ? 'Spremeni →' : 'Napovej'}</a>`;
      }

      // Desktop: full name. Mobile: FIFA code (3 letters)
      const homeName = m.home_team?.name_sl ?? '—';
      const awayName = m.away_team?.name_sl ?? '—';
      const homeCode = m.home_team?.fifa_code ?? homeName;
      const awayCode = m.away_team?.fifa_code ?? awayName;

      return `
        <div class="match-row">
          <div class="match-meta">${dateLabel(m.kickoff_at)}</div>
          <div class="team-block">
            <span class="team-name"><span class="ix-lbl-full">${homeName}</span><span class="ix-lbl-short">${homeCode}</span></span>
            <img src="${NP.flagUrl(m.home_team?.flag_code)}" class="flag" onerror="this.style.display='none'" alt="">
          </div>
          <div class="vs-block">${centerHtml}</div>
          <div class="team-block right">
            <img src="${NP.flagUrl(m.away_team?.flag_code)}" class="flag" onerror="this.style.display='none'" alt="">
            <span class="team-name"><span class="ix-lbl-full">${awayName}</span><span class="ix-lbl-short">${awayCode}</span></span>
          </div>
          <div class="match-pred-col">${predPreviewHtml}</div>
          <div class="match-btn-col">${rightHtml}</div>
        </div>`;
    };

    // ZDAJ divider: only when both past AND future have items, and no live match
    const anyLive = future.some(m => new Date(m.kickoff_at) < now);
    const showDivider = past.length > 0 && future.length > 0 && !anyLive;

    let html = '';
    past.forEach(m  => { html += _renderRow(m, true);  });
    if (showDivider) {
      html += `<div class="zdaj-divider"><span>● ZDAJ</span></div>`;
    }
    future.forEach(m => { html += _renderRow(m, false); });

    list.innerHTML = html || '<div class="no-matches">Ni tekem. 🏁</div>';
  }

  /* ══════════════════════════════════════════════════════
     MINI LEADERBOARD
     ══════════════════════════════════════════════════════ */
  async function _loadLeaderboard(profile, state) {
    const list = document.getElementById('leaderboard-list');

    const { data, error } = await NP.db
      .from('leaderboard')
      .select('user_id, rank, display_name, aliases, total_points, delta, flag_iso2')
      .order('rank')
      .limit(20);

    if (error || !data?.length) {
      list.innerHTML = '<div class="no-matches">Lestvica ni na voljo.</div>';
      return;
    }

    // Find user's position if outside top 8
    const myEntry = data.find(r => r.user_id === profile.id);

    let html = '';
    data.forEach((row, i) => {
      const isMe    = row.user_id === profile.id;
      const rankCls = row.rank === 1 ? 'r1' : row.rank === 2 ? 'r2' : row.rank === 3 ? 'r3' : '';

      // Show alias on national day if alias_names plugin active
      let displayName = row.display_name;
      if (state.isThemedDay && state.plugins.alias_names && row.aliases) {
        const code  = state.themedDay?.theme_code;
        const entry = row.aliases?.[code];
        if (entry?.full) displayName = entry.full;
      }

      const delta      = row.delta ?? 0;
      const deltaCls   = delta > 0 ? 'up' : delta < 0 ? 'down' : 'same';
      const deltaText  = delta > 0 ? `▲${delta}` : delta < 0 ? `▼${Math.abs(delta)}` : '—';

      html += `
        <div class="lb-row ${isMe ? 'me' : ''}">
          <div class="lb-rank ${rankCls}">${row.rank}</div>
          <img src="${NP.flagUrl(row.flag_iso2, 40)}"
               class="lb-avatar"
               onerror="this.style.visibility='hidden'" alt="">
          <div class="lb-name" style="${isMe ? 'color:var(--accent-dark);font-weight:600' : ''}">
            ${displayName}
            ${isMe ? '<span class="lb-alias-tag">ti</span>' : ''}
          </div>
          <div class="lb-pts" style="${isMe ? 'color:var(--accent-dark)' : ''}">${row.total_points}</div>
          <div class="lb-delta ${deltaCls}">${deltaText}</div>
        </div>`;
    });

    list.innerHTML = html;
  }


  /* ══════════════════════════════════════════════════════
     ONBOARDING — 4-step first-login popup
     ══════════════════════════════════════════════════════ */
  let _obStep = 1;
  let _obProfile = null;
  let _obRivalId = null;
  let _obRivalName = '';
  let _obUsers = [];

  function _obShouldShow(profile) {
    return !localStorage.getItem('np_onboarded_' + profile.id);
  }

  async function _obStart(profile) {
    _obProfile = profile;
    if (!_obShouldShow(profile)) return;
    const { data } = await NP.db.from('users').select('id, display_name').neq('id', profile.id).order('display_name');
    _obUsers = data || [];
    _obStep = 1;
    document.getElementById('ob-overlay').style.display = 'flex';
    _obRender();
  }

  function _obDismiss() {
    try {
      if (_obProfile?.id) localStorage.setItem('np_onboarded_' + _obProfile.id, '1');
    } catch(e) {}
    const overlay = document.getElementById('ob-overlay');
    if (overlay) overlay.style.display = 'none';
  }

  function _obProgress(step) {
    for (let i = 1; i <= 4; i++) {
      const el = document.getElementById('ob-p' + i); if(el) el.classList.toggle('done', i <= step);
    }
  }

  async function _obRender() {
    _obProgress(_obStep);
    const el = document.getElementById('ob-step-content');
    if (_obStep === 1) el.innerHTML = _obStep1();
    else if (_obStep === 2) el.innerHTML = _obStep2();
    else if (_obStep === 3) el.innerHTML = await _obStep3();
    else if (_obStep === 4) el.innerHTML = _obStep4();

    // Attach button listeners — no global scope needed
    el.querySelector('[data-ob="back"]')?.addEventListener('click', () => { _obStep--; _obRender(); });
    el.querySelector('[data-ob="skip"]')?.addEventListener('click', () => _obDismiss());
    el.querySelector('[data-ob="next"]')?.addEventListener('click', () => {
      if (_obStep < 4) { _obStep++; _obRender(); }
      else _obFinish();
    });
    el.querySelectorAll('[data-ob-rival]').forEach(btn =>
      btn.addEventListener('click', () => _obSelectRival(btn.dataset.obRival, btn.dataset.obName, btn))
    );
    el.querySelectorAll('[data-ob-country]').forEach(btn =>
      btn.addEventListener('click', () => _obSelectCountry(btn.dataset.obCountry, btn))
    );
  }

  function _obFooter(step) {
    const back = step > 1
      ? `<button class="ob-btn-back" onclick="_obStep--;_obRender()">← Nazaj</button>`
      : `<div></div>`;
    const skip = step < 4
      ? `<button class="ob-btn-skip" onclick="_obDismiss()">Preskoči</button>`
      : '';
    const nextLabel = step < 4 ? 'Naprej →'
      : (_obRivalId ? `Začni z ${_obRivalName} →` : 'Začni igro →');
    const next = `<button class="ob-btn-next" id="ob-next-btn" onclick="${step < 4 ? '_obStep++;_obRender()' : '_obFinish()'}">${nextLabel}</button>`;
    return `<div class="ob-footer">${back}<div style="display:flex;align-items:center;margin-left:auto">${skip}${next}</div></div>`;
  }

  function _obStep1() {
    return `
      <div class="ob-eyebrow">Korak 1 / 4 · Kako deluje</div>
      <div class="ob-title">Napoveduj izide, zbiraj točke</div>
      <div class="ob-subtitle">Pred vsako tekmo napoveš končni izid. Pazi: napoved se zaklene eno uro pred začetkom tekme. Točke dobiš takole:</div>
      <div class="ob-row green">
        <div class="ob-row-pts">+3</div>
        <div class="ob-row-body"><strong>Točen izid</strong><span>Uganeš natančen rezultat (npr. 2–1)</span></div>
      </div>
      <div class="ob-row yellow">
        <div class="ob-row-pts">+1</div>
        <div class="ob-row-body"><strong>Pravilen zmagovalec</strong><span>Pravilna ekipa ali remi, a napačen izid</span></div>
      </div>
      <div class="ob-row grey">
        <div class="ob-row-pts" style="font-size:1rem">0</div>
        <div class="ob-row-body"><strong>Napačno</strong><span>Napačen zmagovalec</span></div>
      </div>
      <div class="ob-multiplier">
        <div class="ob-multiplier-badge">×2</div>
        <div>V izločilnih bojih se točke <strong>podvojijo</strong> (×2), v finalu <strong>potrojijo</strong> (×3).</div>
      </div>
      ${_obFooter(1)}`;
  }

  function _obStep2() {
    return `
      <div class="ob-eyebrow">Korak 2 / 4 · Bonus napovedi</div>
      <div class="ob-title">Dve veliki napovedi za bonus</div>
      <div class="ob-subtitle">Pred začetkom prvenstva napovej zmagovalca in najboljšega strelca. Če zadeneš, prejmeš bonus točke.</div>
      <div class="ob-row green">
        <div class="ob-row-pts" style="font-size:1.5rem">🏆</div>
        <div class="ob-row-body"><strong>Svetovni prvak</strong><span>Katera reprezentanca bo dvignila pokal?</span></div>
        <div class="ob-row-pts-right">+10</div>
      </div>
      <div class="ob-row yellow">
        <div class="ob-row-pts" style="font-size:1.5rem">⚽</div>
        <div class="ob-row-body"><strong>Najboljši strelec</strong><span>Kdo bo zabil največ golov na turnirju?</span></div>
        <div class="ob-row-pts-right">+8</div>
      </div>
      <div class="ob-note">Napoved lahko spremeniš do prve tekme · nato se zaklene 🔒</div>
      ${_obFooter(2)}`;
  }



  let _obCountryIso = null;
  let _obTeams = [];

  async function _obStep3() {
    if (!_obTeams.length) {
      const { data } = await NP.db.from('teams').select('id, name_sl, flag_code').order('name_sl');
      _obTeams = data || [];
    }
    _obCountryIso = _obProfile.avatar_team_iso2 || 'si';
    const grid = _obTeams.map(t => {
      const sel = t.flag_code === _obCountryIso;
      return `<div data-ob-country="${t.flag_code}" data-iso="${t.flag_code}"
        style="display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;
          border-radius:8px;cursor:pointer;transition:all .15s;
          border:2px solid ${sel ? 'var(--accent)' : 'transparent'};
          background:${sel ? 'var(--accent-bg)' : 'transparent'}">
        <img src="https://flagcdn.com/w40/${t.flag_code.toLowerCase()}.png"
          style="width:32px;height:22px;object-fit:cover;border-radius:3px;border:1px solid var(--border)">
        <span style="font-size:.58rem;font-weight:600;text-align:center;color:var(--text-mid);line-height:1.2">${t.name_sl}</span>
      </div>`;
    }).join('');
    const subtitle = _obProfile.gender === 'f'
      ? 'Izberi reprezentanco, za katero boš stiskala pesti na letošnjem prvenstvu.'
      : 'Izberi reprezentanco, za katero boš stiskal pesti na letošnjem prvenstvu.';
    return `
      <div class="ob-eyebrow">Korak 3 / 4 · Navijaški kotiček</div>
      <div class="ob-title">Za koga bije tvoje srce?</div>
      <div class="ob-subtitle">${subtitle}</div>
      <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:6px;max-height:240px;overflow-y:auto;margin-bottom:12px" id="ob-country-grid">
        ${grid}
      </div>
      <div style="font-size:.75rem;color:var(--muted);text-align:center">Izbiro reprezentance kadarkoli kasneje spremeniš v svojem profilu.</div>
      ${_obFooter(3)}`;
  }

  function _obSelectCountry(iso, el) {
    _obCountryIso = iso;
    document.querySelectorAll('#ob-country-grid > div').forEach(d => {
      const sel = d.dataset.iso === iso;
      d.style.borderColor = sel ? 'var(--accent)' : 'transparent';
      d.style.background  = sel ? 'var(--accent-bg)' : 'transparent';
    });
  }

  function _obStep4() {
    const chips = _obUsers.map(u => {
      const sel = u.id === _obRivalId;
      return `<div class="ob-colleague-chip ${sel?'selected':''}" data-ob-rival="${u.id}" data-ob-name="${u.display_name}">${u.display_name}</div>`;
    }).join('');
    return `
      <div class="ob-eyebrow">Korak 4 / 4 · Izberi tekmeca</div>
      <div class="ob-title">${_obProfile.gender === 'f' ? 'Koga boš premagala?' : 'Koga boš premagal?'}</div>
      <div class="ob-subtitle">Izberi enega sodelavca ali sodelavko za osebni dvoboj čez prvenstvo. Ves čas vidiš, kdo vodi. Lahko ga/jo kasneje zamenjaš.</div>
      <div class="ob-colleague-grid">${chips}</div>
      ${_obFooter(4)}`;
  }

  function _obSelectRival(id, name, el) {
    _obRivalId = id;
    _obRivalName = name;
    document.querySelectorAll('.ob-colleague-chip').forEach(c => c.classList.remove('selected'));
    el.classList.add('selected');
    const btn = document.getElementById('ob-next-btn');
    if (btn) btn.textContent = 'Začni z ' + name + ' →';
  }

  async function _obFinish() {
    try {
      const updates = {};
      if (_obRivalId) updates.rival_user_id = _obRivalId;
      if (_obCountryIso) updates.avatar_team_iso2 = _obCountryIso;
      if (Object.keys(updates).length) {
        const { error } = await NP.db.from('users').update(updates).eq('id', _obProfile.id);
        if (error) console.warn('Onboarding save error:', error.message);
        else {
          Object.assign(_obProfile, updates);
          localStorage.setItem('np_session', JSON.stringify(_obProfile));
        }
      }
    } catch(e) {
      console.warn('Onboarding finish error:', e);
    }
    _obDismiss();
  }

  /* ══════════════════════════════════════════════════════
     HELPER — flag emoji from ISO2
     ══════════════════════════════════════════════════════ */
  // Expose onboarding functions to global scope (called from onclick)
  window._obFinish       = _obFinish;
  window._obDismiss      = _obDismiss;
  window._obSelectRival  = _obSelectRival;
  window._obSelectCountry= _obSelectCountry;

  </script>

</body>
</html>
