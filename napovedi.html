<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Napovednik 2026 — Napovedi ekipe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=3">
  <style>
    .nap-header { display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:24px;flex-wrap:wrap; }
    .nap-eyebrow { font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:3px; }
    .nap-title   { font-size:1.6rem;font-weight:800;letter-spacing:-.02em;color:var(--text);line-height:1.1; }
    .nap-subtitle { font-size:.78rem;color:var(--muted);margin-top:4px; }
    .nap-stats-trio { display:flex;align-items:center;gap:20px;flex-shrink:0;padding-top:4px; }
    .nap-stat { display:flex;flex-direction:column;align-items:flex-end;gap:1px; }
    .nap-stat-num { font-size:1.4rem;font-weight:800;line-height:1; }
    .nap-stat-label { font-size:.58rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted); }
    .nap-stat.povprecne .nap-stat-num { color:var(--gold); }
    .nap-stat.delez .nap-stat-num { color:var(--accent-dark); }

    .nap-day-label { font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px;padding-left:2px;display:flex;align-items:center;gap:8px; }
    .nap-day-label::after { content:'';flex:1;height:1px;background:var(--border); }
    .today-pill { background:var(--accent);color:white;font-size:.6rem;font-weight:800;padding:1px 7px;border-radius:99px; }

    .nap-match { background:var(--bg-mid);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:0 1px 3px rgba(40,80,44,.06);margin-bottom:8px; }
    .nap-match-header { display:flex;align-items:center;padding:11px 16px;gap:10px;cursor:pointer;user-select:none;transition:background var(--t-fast); }
    .nap-match-header:hover { background:var(--bg-deep); }
    .nap-match.open .nap-match-header { background:var(--bg-deep); }
    .nap-group { font-size:.65rem;font-weight:700;color:var(--muted);width:46px;flex-shrink:0; }
    .nap-teams { display:flex;align-items:center;gap:8px;flex:1;min-width:0; }
    .nap-team  { display:flex;align-items:center;gap:5px;flex:1; }
    .nap-team.right { justify-content:flex-end; }
    .nap-team-name { font-size:.88rem;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
    .nap-lbl-short { display:none; }
    @media (max-width: 768px) {
      .nap-lbl-full  { display:none; }
      .nap-lbl-short { display:inline; }
    }
    .nap-team img  { width:22px;height:15px;object-fit:cover;border-radius:2px;border:1px solid var(--border);flex-shrink:0; }
    .nap-score { font-size:1rem;font-weight:800;color:var(--text);min-width:44px;text-align:center;flex-shrink:0; }
    .nap-time  { font-size:.82rem;color:var(--muted);font-weight:600;min-width:44px;text-align:center;flex-shrink:0; }
    .nap-meta  { display:flex;align-items:center;gap:8px;flex-shrink:0; }
    .nap-status-pill { font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap; }
    .nap-status-pill.waiting  { background:var(--gold-bg);color:var(--gold);border:1px solid rgba(180,90,0,.2); }
    .nap-status-pill.exact    { background:var(--green-bg);color:var(--green-text);border:1px solid rgba(68,157,68,.25); }
    .nap-status-pill.partial  { background:var(--blue-bg);color:var(--blue);border:1px solid rgba(29,78,216,.2); }
    .nap-status-pill.none     { background:var(--bg-deep);color:var(--muted);border:1px solid var(--border); }
    .nap-count { font-size:.7rem;color:var(--muted);white-space:nowrap; }
    .nap-arrow { font-size:.65rem;color:var(--muted);transition:transform var(--t-base);flex-shrink:0; }
    .nap-match.open .nap-arrow { transform:rotate(180deg); }

    .dist-bar-wrap { padding:10px 16px 0; }
    .dist-bar { display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--bg-deep); }
    .dist-seg { height:100%;transition:width .5s ease; }
    .dist-seg.home { background:var(--accent); }
    .dist-seg.draw { background:var(--muted); }
    .dist-seg.away { background:var(--blue); }
    .dist-legend { display:flex;align-items:center;justify-content:space-between;padding:6px 0 4px;font-size:.7rem;color:var(--muted); }
    .dist-legend-item { display:flex;align-items:center;gap:4px; }
    .dist-legend-item img { width:14px;height:10px;object-fit:cover;border-radius:1px;border:1px solid var(--border); }

    .score-groups { padding:8px 16px 14px; }
    .score-group { margin-bottom:10px; }
    .score-group-header { display:flex;align-items:center;gap:8px;margin-bottom:6px; }
    .score-group-score { font-size:.92rem;font-weight:800;color:var(--text);min-width:32px; }
    .score-group-score.exact-score { color:var(--green-text); }
    .score-group-badge { font-size:.62rem;font-weight:800;padding:1px 6px;border-radius:99px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap; }
    .score-group-badge.exact    { background:#dcfce7;color:#166534; }
    .score-group-badge.correct  { background:#dbeafe;color:#1e40af; }
    .score-group-badge.wrong    { background:#fef9c3;color:#854d0e; }
    .score-group-pts  { font-size:.68rem;font-weight:700;color:var(--muted); }
    .score-group-count { font-size:.68rem;color:var(--muted);margin-left:auto; }
    .score-group-chips { display:flex;flex-wrap:wrap;gap:5px; }

    .nap-chip { display:inline-flex;align-items:center;gap:5px;padding:3px 9px 3px 7px;border:1px solid var(--border);border-radius:99px;background:var(--bg-mid);font-size:.75rem;font-weight:500;color:var(--text-mid); }
    .nap-chip img { width:14px;height:10px;object-fit:cover;border-radius:1px;border:1px solid var(--border); }
    .nap-chip.me { border-color:var(--accent);background:var(--accent-bg);color:var(--accent-dark);font-weight:700; }
    .nap-chip.wrong { opacity:.5; }
    .nap-chip.no-pred { border-style:dashed;border-color:var(--border-dark);background:transparent;color:var(--muted);opacity:.65; }

    .no-pred-group { margin-top:10px;padding-top:8px;border-top:1px dashed var(--border-dark); }
    .no-pred-label { font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:5px; }

    .load-more-btn { display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:14px;background:none;border:none;font-family:var(--font-main);font-size:.82rem;font-weight:600;color:var(--muted);cursor:pointer;transition:color var(--t-fast);margin-top:8px; }
    .load-more-btn:hover { color:var(--text); }

    /* ── NAPOVEDI MOBILE ── */
    @media (max-width: 768px) {
      /* Page header: stats wrap below title, left-aligned */
      .nap-header { flex-direction: column; gap: 12px; margin-bottom: 16px; }
      .nap-stats-trio { justify-content: flex-start; gap: 20px; padding-top: 0; }
      .nap-stat { align-items: flex-start; }
      .nap-title { font-size: 1.35rem; }

      /* Match header: group + teams-grid + meta on one line */
      .nap-match-header { padding: 10px 13px; gap: 6px; }
      .nap-group { width: 24px; font-size: .62rem; }

      /* Teams: fixed 3-col grid — home | score | away */
      .nap-teams {
        display: grid !important;
        grid-template-columns: 72px 48px 72px !important;
        align-items: center !important;
        gap: 0 !important;
        flex: unset !important;
      }
      .nap-team { flex: unset !important; }
      .nap-team.right { justify-content: flex-start !important; }
      .nap-team-name { font-size: .82rem !important; font-weight: 700 !important; }
      .nap-team img  { width: 18px !important; height: 12px !important; }
      .nap-score, .nap-time { font-size: .84rem !important; min-width: unset !important; }

      /* Meta: hide count, keep pill + arrow */
      .nap-count { display: none; }
      .nap-meta  { gap: 6px; }

      /* Distribution legend: stack vertically */
      .dist-legend { flex-direction: column; gap: 4px; align-items: flex-start; padding: 6px 0 6px; }

      /* Score group header: allow wrap */
      .score-group-header { flex-wrap: wrap; gap: 4px 6px; }
      .score-group-count  { margin-left: 0; }
    }

    @media (max-width: 480px) {
      .nap-title { font-size: 1.2rem; }
      .nap-stat-num { font-size: 1.2rem; }
      .nap-stat-label { font-size: .52rem; }
      .nap-chip { font-size: .7rem; padding: 3px 7px 3px 6px; }
    }
  </style>
</head>

  <div class="container page-wrap">

        <div class="nap-eyebrow">Napovedi</div>

  <script>
  const MONTHS_SL = ['jan','feb','mar','apr','maj','jun','jul','avg','sep','okt','nov','dec'];
  const DAYS_SL   = ['ned','pon','tor','sre','čet','pet','sob'];
  let _profile, _state, _allMatches, _users, _userMap, _predsByMatch;
  let _daysLoaded = 0;
  const DAYS_PER_LOAD = 5;

  (async () => {
    if (!NP.requireAuth()) return;
    _profile = NP.getUserProfile();
    _state   = await NP.getTournamentNow();

    var __sl = document.getElementById('navbar-selektor-link'); if(__sl && NP.isAdmin()) __sl.style.display = 'flex';
    document.getElementById('nav-name').textContent = NP.getAlias(_profile, _state, 'full');
    document.getElementById('nav-avatar').textContent =
      _state.isThemedDay && _state.themedDay?.theme_flag_iso2
        ? _flagEmoji(_state.themedDay.theme_flag_iso2)
        : _profile.display_name.charAt(0).toUpperCase();

    const [matchesRes, predsRes, usersRes] = await Promise.all([
      NP.db.from('matches')
        .select(`id, phase, group_name, kickoff_at,
          home_score_90, away_score_90, home_score_120, away_score_120,
          home_team:teams!matches_home_team_id_fkey(id, name_sl, flag_code, fifa_code),
          away_team:teams!matches_away_team_id_fkey(id, name_sl, flag_code, fifa_code)`)
        .not('home_team_id', 'is', null)
        .order('kickoff_at', { ascending: false }),
      NP.db.from('predictions').select('user_id, match_id, pred_home, pred_away, points_awarded'),
      NP.db.from('users').select('id, display_name, original_name, avatar_team_iso2, aliases'),
    ]);

    _allMatches = matchesRes.data ?? [];
    _users      = usersRes.data   ?? [];
    _userMap    = {};
    _users.forEach(u => { _userMap[u.id] = u; });

    _predsByMatch = {};
    (predsRes.data ?? []).forEach(p => {
      if (!_predsByMatch[p.match_id]) _predsByMatch[p.match_id] = [];
      _predsByMatch[p.match_id].push(p);
    });

    document.getElementById('nap-subtitle').textContent =
      `${_users.length} uporabnikov · Razkrijemo po roku za oddajo · Preveri napovedi ostalih`;

    _computeStats();
    _render();
  })();

  function _computeStats() {
    const now = new Date();
    const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const todayEnd   = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59);
    const todayDone  = _allMatches.filter(m => {
      const d = new Date(m.kickoff_at);
      return d >= todayStart && d <= todayEnd && NP.isPredictionLocked(m.kickoff_at);
    });
    document.getElementById('stat-razkrito').textContent = todayDone.length;

    if (todayDone.length > 0) {
      const ids = todayDone.map(m => m.id);
      const pts = Object.values(_predsByMatch)
        .flat()
        .filter(p => ids.includes(p.match_id) && p.points_awarded !== null);
      const total = pts.reduce((s, p) => s + (p.points_awarded ?? 0), 0);
      document.getElementById('stat-povprecne').textContent =
        _users.length > 0 ? (total / _users.length).toFixed(1) : '—';

      const myPts = pts.filter(p => p.user_id === _profile.id)
                       .reduce((s, p) => s + (p.points_awarded ?? 0), 0);
      const userPts = _users.map(u => ({
        id: u.id,
        pts: pts.filter(p => p.user_id === u.id).reduce((s, p) => s + (p.points_awarded ?? 0), 0)
      })).sort((a, b) => b.pts - a.pts);
      const rank = userPts.findIndex(u => u.id === _profile.id) + 1;
      document.getElementById('stat-delez').textContent = rank > 0 ? `#${rank}` : '—';
    }
  }

  function _render() {
    const byDay = {};
    _allMatches.forEach(m => {
      if (!NP.isPredictionLocked(m.kickoff_at)) return;
      const key = _localDateKey(m.kickoff_at);
      if (!byDay[key]) byDay[key] = [];
      byDay[key].push(m);
    });

    const days = Object.keys(byDay).sort().reverse();
    const todayKey = _localDateKey(new Date().toISOString());
    const visible  = days.slice(0, Math.max(2, _daysLoaded + 2));
    const hasMore  = days.length > visible.length;

    let html = '';
    visible.forEach(dayKey => {
      const dayMatches = byDay[dayKey];
      const d = new Date(dayKey + 'T12:00:00');
      const isToday = dayKey === todayKey;
      const dateStr = `${d.getDate()}. ${MONTHS_SL[d.getMonth()]} · ${DAYS_SL[d.getDay()]}`;

      html += `<div style="margin-bottom:20px">`;
      html += `<div class="nap-day-label">${dateStr}${isToday ? ' <span class="today-pill">danes</span>' : ''}</div>`;
      dayMatches.forEach((m, i) => { html += _renderMatch(m, isToday && i < 2); });
      html += `</div>`;
    });

    document.getElementById('napovedi-content').innerHTML =
      html || '<div style="padding:40px;text-align:center;color:var(--muted)">Ni razkritih napovedi.</div>';
    document.getElementById('load-more-btn').style.display = hasMore ? 'flex' : 'none';
  }

  function _loadMore() { _daysLoaded += DAYS_PER_LOAD; _render(); }

  function _renderMatch(m, autoOpen) {
    const preds    = _predsByMatch[m.id] ?? [];
    const finished = m.home_score_90 !== null;
    const mult     = _state.multiplier ?? 1;
    const noPred   = _users.filter(u => !preds.find(p => p.user_id === u.id));

    // Status pill
    let statusHtml = '';
    if (!finished) {
      statusHtml = `<span class="nap-status-pill waiting">⏳ čaka rezultat</span>`;
    } else {
      const exact = preds.filter(p => NP.scoring.calcBasePoints(p, m) === 3).length;
      const correct = preds.filter(p => NP.scoring.calcBasePoints(p, m) === 1).length;
      if (exact > 0)        statusHtml = `<span class="nap-status-pill exact">${exact} točen ${exact === 1 ? 'izid' : 'izidi'}</span>`;
      else if (correct > 0) statusHtml = `<span class="nap-status-pill partial">${correct} pravilnih</span>`;
      else                  statusHtml = `<span class="nap-status-pill none">0 točnih izidov</span>`;
    }

    const scoreHtml = finished
      ? `<span class="nap-score">${m.home_score_120 ?? m.home_score_90}–${m.away_score_120 ?? m.away_score_90}</span>`
      : `<span class="nap-time">${NP.formatKickoff(m.kickoff_at, false)}</span>`;

    const bodyHtml = finished
      ? _renderScoreGroups(m, preds, noPred, mult)
      : _renderLocked(preds, noPred);

    return `
      <div class="nap-match ${autoOpen ? 'open' : ''}" id="nm-${m.id}">
        <div class="nap-match-header" onclick="_toggleMatch(${m.id})">
          <div class="nap-group">${m.group_name ? 'Sk.' + m.group_name : m.phase ?? ''}</div>
          <div class="nap-teams">
            <div class="nap-team">
              <span class="nap-team-name"><span class="nap-lbl-full">${m.home_team?.name_sl ?? '—'}</span><span class="nap-lbl-short">${m.home_team?.fifa_code ?? m.home_team?.name_sl ?? '—'}</span></span>
              <img src="${NP.flagUrl(m.home_team?.flag_code)}" alt="" onerror="this.style.display='none'">
            </div>
            ${scoreHtml}
            <div class="nap-team right">
              <img src="${NP.flagUrl(m.away_team?.flag_code)}" alt="" onerror="this.style.display='none'">
              <span class="nap-team-name"><span class="nap-lbl-full">${m.away_team?.name_sl ?? '—'}</span><span class="nap-lbl-short">${m.away_team?.fifa_code ?? m.away_team?.name_sl ?? '—'}</span></span>
            </div>
          </div>
          <div class="nap-meta">
            ${statusHtml}
            <span class="nap-count">${preds.length}/${_users.length} oddanih</span>
          </div>
          <span class="nap-arrow">▼</span>
        </div>
        <div id="nmb-${m.id}" style="display:${autoOpen ? 'block' : 'none'}">
          ${finished ? _renderDistBar(m, preds) : ''}
          ${bodyHtml}
        </div>
      </div>`;
  }

  function _toggleMatch(id) {
    const el   = document.getElementById('nm-' + id);
    const body = document.getElementById('nmb-' + id);
    const open = el.classList.toggle('open');
    body.style.display = open ? 'block' : 'none';
  }

  function _renderDistBar(m, preds) {
    const outcomes = { H: 0, D: 0, A: 0 };
    preds.forEach(p => {
      const o = p.pred_home > p.pred_away ? 'H' : p.pred_home < p.pred_away ? 'A' : 'D';
      outcomes[o]++;
    });
    const total = preds.length || 1;
    const hPct = Math.round(outcomes.H / total * 100);
    const dPct = Math.round(outcomes.D / total * 100);
    const aPct = 100 - hPct - dPct;
    const fs = 'width:14px;height:10px;object-fit:cover;border-radius:1px;border:1px solid var(--border)';
    return `
      <div class="dist-bar-wrap">
        <div class="dist-bar">
          <div class="dist-seg home" style="width:${hPct}%"></div>
          <div class="dist-seg draw" style="width:${dPct}%"></div>
          <div class="dist-seg away" style="width:${aPct}%"></div>
        </div>
        <div class="dist-legend">
          <div class="dist-legend-item"><img src="${NP.flagUrl(m.home_team?.flag_code,40)}" style="${fs}" alt=""> ${m.home_team?.name_sl} zmaga · ${hPct}%</div>
          <div class="dist-legend-item">Remi · ${dPct}%</div>
          <div class="dist-legend-item"><img src="${NP.flagUrl(m.away_team?.flag_code,40)}" style="${fs}" alt=""> ${m.away_team?.name_sl} zmaga · ${aPct}%</div>
        </div>
      </div>`;
  }

  function _renderScoreGroups(m, preds, noPred, mult) {
    if (!preds.length && !noPred.length) return '<div style="padding:12px 16px;font-size:.8rem;color:var(--muted)">Ni napovedi.</div>';
    const groups = {};
    preds.forEach(p => {
      const key = `${p.pred_home}-${p.pred_away}`;
      if (!groups[key]) groups[key] = [];
      groups[key].push(p);
    });

    const sorted = Object.entries(groups).sort(([ka, a], [kb, b]) => {
      const pa = ka.split('-').map(Number);
      const pb = kb.split('-').map(Number);
      const baseA = NP.scoring.calcBasePoints({ pred_home: pa[0], pred_away: pa[1] }, m);
      const baseB = NP.scoring.calcBasePoints({ pred_home: pb[0], pred_away: pb[1] }, m);
      return baseA !== baseB ? baseB - baseA : b.length - a.length;
    });

    let html = '<div class="score-groups">';
    sorted.forEach(([key, gPreds]) => {
      const [ph, pa] = key.split('-').map(Number);
      const base = NP.scoring.calcBasePoints({ pred_home: ph, pred_away: pa }, m);
      const pts  = NP.scoring.applyMultiplier(base, mult);
      const bcls = base === 3 ? 'exact' : base === 1 ? 'correct' : 'wrong';
      const btxt = base === 3 ? '✓ Natančno' : base === 1 ? '✓ Pravilno' : '✗ Napačno';
      const chips = gPreds.map(p => _chip(p.user_id, base === 0 ? 'wrong' : '')).join('');
      html += `
        <div class="score-group">
          <div class="score-group-header">
            <span class="score-group-score ${base === 3 ? 'exact-score' : ''}">${ph}–${pa}</span>
            <span class="score-group-badge ${bcls}">${btxt}</span>
            <span class="score-group-pts">${base > 0 ? '· +' + pts : '· +0'}</span>
            <span class="score-group-count">${gPreds.length} ${gPreds.length === 1 ? 'igralec' : 'igralcev'}</span>
          </div>
          <div class="score-group-chips">${chips}</div>
        </div>`;
    });

    if (noPred.length) {
      html += `<div class="no-pred-group">
        <div class="no-pred-label">Ni napovedi · ${noPred.length} igralcev</div>
        <div class="score-group-chips">${noPred.map(u => _chipUser(u, 'no-pred')).join('')}</div>
      </div>`;
    }
    return html + '</div>';
  }

  function _renderLocked(preds, noPred) {
    if (!preds.length) return '<div style="padding:12px 16px;font-size:.8rem;color:var(--muted)">Nihče ni oddal napovedi.</div>';
    const chips = preds.map(p => {
      const u = _userMap[p.user_id];
      const isMe = p.user_id === _profile.id;
      const flag = u?.avatar_team_iso2;
      const name = _displayName(u);
      return `<span class="nap-chip ${isMe ? 'me' : ''}">
        ${flag ? `<img src="${NP.flagUrl(flag,40)}" alt="" onerror="this.style.display='none'">` : ''}
        ${_esc(name)}${isMe ? ' <span style="font-size:.58rem">(ti)</span>' : ''}
        <span style="font-size:.72rem;font-weight:700;font-family:monospace">${p.pred_home}–${p.pred_away}</span>
      </span>`;
    }).join('');
    const noChips = noPred.map(u => _chipUser(u, 'no-pred')).join('');
    return `<div class="score-groups">
      <div class="score-group-chips" style="margin-bottom:${noPred.length ? '10px' : '0'}">${chips}</div>
      ${noPred.length ? `<div class="no-pred-group">
        <div class="no-pred-label">Ni napovedi · ${noPred.length} igralcev</div>
        <div class="score-group-chips">${noChips}</div>
      </div>` : ''}
    </div>`;
  }

  function _chip(userId, extraCls) {
    const u = _userMap[userId];
    const isMe = userId === _profile.id;
    return _chipUser(u, (isMe ? 'me ' : '') + (extraCls || ''));
  }

  function _chipUser(u, extraCls) {
    const name = _displayName(u);
    const flag = u?.avatar_team_iso2;
    const isMe = u?.id === _profile.id;
    return `<span class="nap-chip ${extraCls || ''}">
      ${flag ? `<img src="${NP.flagUrl(flag,40)}" alt="" onerror="this.style.display='none'">` : ''}
      ${_esc(name)}${isMe ? ' <span style="font-size:.58rem">(ti)</span>' : ''}
    </span>`;
  }

  function _displayName(u) {
    if (!u) return '?';
    if (_state.isThemedDay && _state.plugins.alias_names && u.aliases) {
      const entry = u.aliases?.[_state.themedDay?.theme_code];
      if (entry?.full) return entry.full;
    }
    return u.display_name ?? u.original_name ?? '?';
  }

  function _localDateKey(iso) {
    const d = new Date(iso);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  function _esc(s) { return s ? String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') : ''; }
  function _flagEmoji(iso2) {
    if (!iso2 || iso2.length !== 2) return '';
    const b = 0x1F1E6 - 65;
    return String.fromCodePoint(b + iso2.toUpperCase().charCodeAt(0)) + String.fromCodePoint(b + iso2.toUpperCase().charCodeAt(1));
  }
  </script>
  <script>
    (function(){
      var btn   = document.getElementById('nav-menu-btn');
      var links = document.getElementById('navbar-links');
      if (!btn || !links) return;
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        var open = links.classList.toggle('open');
        btn.setAttribute('aria-expanded', open);
        btn.textContent = open ? '\u2715' : '\u2630';
      });
      document.addEventListener('click', function(e){
        if (!links.contains(e.target) && e.target !== btn) {
          links.classList.remove('open');
          btn.setAttribute('aria-expanded', false);
          btn.textContent = '\u2630';
        }
      });
      links.querySelectorAll('.navbar-link').forEach(function(a){
        a.addEventListener('click', function(){
          links.classList.remove('open');
          btn.textContent = '\u2630';
        });
      });
    })();
  </script>
</body>
</html>
